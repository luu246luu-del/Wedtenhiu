<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Của riêng chúng mình</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1. TOKENS + BASE
   ===================================================================== */
:root{
  --ink:#5b1a3c; --ink-soft:rgba(91,26,60,.68);
  --rose:#e5608f; --rose-deep:#b83d6d;
  --pink:#ff8db6; --pink-soft:#ffd0e2; --blush:#fff1f6;
  --gold:#e6b3a2; --lilac:#e4d2ff; --peach:#ffd9c6; --mint:#cdf1e6; --sky:#cfe5ff;

  --glass-bg:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.3));
  --glass-border:rgba(255,255,255,.85);
  --glass-shadow:0 24px 46px -22px rgba(214,80,135,.5),0 1px 0 rgba(255,255,255,.95) inset;

  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --font-display:'Playfair Display','Times New Roman',serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-script:'Dancing Script','Segoe Script',cursive;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);

  --lock-bg:
    radial-gradient(100% 55% at 50% 0%,#ffffff 0%,transparent 62%),
    radial-gradient(90% 60% at 100% 100%,rgba(255,160,196,.85) 0%,transparent 60%),
    radial-gradient(75% 50% at 0% 70%,rgba(226,206,255,.9) 0%,transparent 62%),
    linear-gradient(165deg,#ffe6ef,#ffcadd 82%);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{
  margin:0;height:100%;overflow:hidden;background:#ffe9f1;color:var(--ink);
  font-family:var(--font-body);
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
img{-webkit-user-drag:none;image-rendering:-webkit-optimize-contrast}
svg{shape-rendering:geometricPrecision}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden}

/* Kính mờ sáng */
.glass{
  position:relative;background:var(--glass-bg);
  -webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);
  border:1px solid rgba(255,255,255,.5);box-shadow:var(--glass-shadow);
}
.glass::before,.card3d__glass::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,#fff,rgba(255,255,255,.15) 45%,rgba(255,190,215,.8));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* =====================================================================
   2. NỀN: MESH PASTEL + TRÁI TIM 3D PHỒNG + LẤP LÁNH
   ===================================================================== */
.mesh{position:absolute;inset:0;overflow:hidden;z-index:0;background:linear-gradient(160deg,#fff2f7,#ffdfeb 55%,#ffe9f2)}
.blob{position:absolute;border-radius:50%;will-change:transform}
.b1{width:95vmax;height:95vmax;left:-40vmax;top:-36vmax;background:radial-gradient(circle,rgba(255,150,190,.75) 0%,transparent 64%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:80vmax;height:80vmax;right:-40vmax;top:8vh;background:radial-gradient(circle,rgba(255,206,180,.85) 0%,transparent 64%);animation:drift2 27s ease-in-out infinite alternate}
.b3{width:95vmax;height:95vmax;left:-34vmax;bottom:-52vmax;background:radial-gradient(circle,rgba(214,190,255,.9) 0%,transparent 64%);animation:drift3 30s ease-in-out infinite alternate}
.b4{width:60vmax;height:60vmax;left:30vw;top:36vh;background:radial-gradient(circle,rgba(190,225,255,.7) 0%,transparent 66%);animation:drift4 19s ease-in-out infinite alternate}
.b5{width:80vmax;height:80vmax;right:-44vmax;bottom:-34vmax;background:radial-gradient(circle,rgba(240,170,170,.65) 0%,transparent 64%);animation:drift5 25s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(32vw,20vh,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-30vw,-16vh,0) scale(.86)}}
@keyframes drift3{to{transform:translate3d(38vw,-22vh,0) scale(1.12)}}
@keyframes drift4{50%{transform:translate3d(-26vw,-24vh,0) scale(1.3)}to{transform:translate3d(20vw,18vh,0) scale(.9)}}
@keyframes drift5{to{transform:translate3d(-34vw,-14vh,0) scale(1.2)}}
.mesh__img{position:absolute;inset:0;background:center/cover no-repeat;opacity:.95}
.mesh__sheen{
  position:absolute;inset:-25%;pointer-events:none;opacity:.6;
  background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.7) 48%,transparent 60%);
  animation:sheen 12s ease-in-out infinite alternate;
}
@keyframes sheen{from{transform:translateX(-32%)}to{transform:translateX(32%)}}
body.has-bg-img .pl{display:none}

/* Lớp parallax chứa trái tim */
.pl{
  position:absolute;inset:0;
  transform:translate3d(calc(var(--gx,0)*1px),calc(var(--gy,0)*1px + var(--sy,0)*var(--k,-.2)*1px),0);
  will-change:transform;
}
.pl--far{--k:-.07}.pl--near{--k:-.2}
.pl--static{transform:none}
.pheart{position:absolute;width:var(--s);aspect-ratio:100/92;left:var(--x);top:var(--y);transform:rotate(var(--r))}
.pheart__in{width:100%;height:100%;animation:bob var(--dur) ease-in-out var(--dl) infinite alternate}
.pheart svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes bob{to{transform:translate3d(0,-14px,0) rotate(4deg) scale(1.035)}}
.spark{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);color:var(--c);animation:twinkle var(--dur) ease-in-out var(--dl) infinite}
.spark svg{width:100%;height:100%;display:block}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.pearl{
  position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0,var(--c) 48%,rgba(120,50,90,.18) 100%);
  box-shadow:0 4px 8px -2px rgba(190,70,120,.3);animation:bob var(--dur) ease-in-out var(--dl) infinite alternate;
}
body.is-locked .blob,body.is-locked .pheart__in,body.is-locked .spark,body.is-locked .pearl,
body.has-view .blob,body.has-view .pheart__in,body.has-view .spark,body.has-view .pearl,body.has-view .mesh__sheen,
body.is-video .blob,body.is-video .pheart__in,body.is-video .spark,body.is-video .pearl{animation-play-state:paused}

/* =====================================================================
   3.0 GIAI ĐOẠN 0: MÀN MỞ ĐẦU (VIDEO) + CỬA MỞ SANG MÀN MẬT KHẨU
   ===================================================================== */
.intro{position:fixed;inset:0;z-index:200;overflow:hidden;background:#0c0410}
.intro[hidden]{display:none!important}
.intro__video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
object-position:center center;
transform:scale(1.15);;;display:block;background:#0c0410;transition:visibility 0s .1s}
.intro__veil{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,2,10,.55) 0%,transparent 26%,transparent 68%,rgba(10,2,10,.7) 100%);
}
.intro__skip{
  position:absolute;z-index:5;border:1px solid rgba(255,255,255,.55);color:#fff;
  background:rgba(30,12,26,.55);
  transition:opacity .35s,transform .35s var(--spring);
}
.intro__skip:active{transform:scale(.9)}
.intro__skip{right:18px;bottom:calc(var(--sab) + 22px);padding:11px 20px;border-radius:999px;font:500 13.5px var(--font-body);letter-spacing:.01em}
.intro.is-leaving .intro__skip{opacity:0;visibility:hidden;pointer-events:none}

/* Cửa đôi: mở ra để lộ màn mật khẩu phía sau */
.intro__doors{position:absolute;inset:0;z-index:3;perspective:1500px}
.door{
  position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.7,-.12,.26,1);will-change:transform;
}
.door--l{left:0;transform-origin:left center;transform:translateX(-101%)}
.door--r{right:0;transform-origin:right center;transform:translateX(101%)}
.intro.is-closing .door--l,.intro.is-closing .door--r{transition:transform .56s var(--ease-out)}
.intro.is-closing .door--l{transform:translateX(0)}
.intro.is-closing .door--r{transform:translateX(0)}
.intro.is-opening .door--l{transform:translateX(0) rotateY(-108deg)}
.intro.is-opening .door--r{transform:translateX(0) rotateY(108deg)}
.door__panel{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.4) 0%,transparent 7%,transparent 93%,rgba(0,0,0,.4) 100%),
    linear-gradient(155deg,#ffd7e6,#ff9dbf 40%,#e5608f 78%,#b83d6d);
  border:2px solid rgba(255,255,255,.55);
  box-shadow:inset 0 0 46px rgba(255,255,255,.35),inset 0 0 0 10px rgba(255,255,255,.16),0 0 70px rgba(0,0,0,.55);
}
.door__panel::before{content:'';position:absolute;inset:22px;border:1.5px solid rgba(255,255,255,.5);border-radius:16px;box-shadow:inset 0 0 28px rgba(255,255,255,.22)}
.door__panel::after{content:'\2665';position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:34px;line-height:1;color:rgba(255,255,255,.8);text-shadow:0 0 18px rgba(255,255,255,.65)}
.door__handle{position:absolute;top:50%;width:9px;height:54px;margin-top:-27px;border-radius:6px;background:linear-gradient(180deg,#fff6d8,#e6b3a2);box-shadow:0 3px 10px rgba(0,0,0,.45)}
.door--l .door__handle{right:15px}
.door--r .door__handle{left:15px}
.door__glow{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;opacity:0;background:radial-gradient(58% 70% at 50% 48%,rgba(255,255,255,.95),rgba(255,205,225,.45) 42%,transparent 72%)}
.intro.is-opening .door__glow{animation:doorGlow 1.05s ease-out forwards}
@keyframes doorGlow{0%{opacity:0}32%{opacity:.95}100%{opacity:0}}

/* =====================================================================
   3. GIAI ĐOẠN 1: MÀN HÌNH KHÓA
   ===================================================================== */
.lock{
  position:fixed;inset:0;z-index:100;overflow:hidden;background:var(--lock-bg);
  perspective:1000px;perspective-origin:var(--ix,50%) var(--iy,50%);
}
.lock.is-breaking{background:transparent;pointer-events:none}
.lock__content{
  position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 24px);text-align:center;
}
.lock.is-breaking .lock__content{animation:contentOut .5s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes contentOut{to{opacity:0;transform:scale(1.22);filter:blur(10px)}}
.lock__hearts{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}

.lock__crest{
  width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(150deg,#fff,rgba(255,220,235,.6));border:1px solid #fff;
  box-shadow:0 14px 34px -10px rgba(229,96,143,.6),inset 0 2px 0 #fff;
  transition:box-shadow .4s,transform .6s var(--spring);
}
.lock__crest svg{width:32px;height:32px;filter:drop-shadow(0 4px 8px rgba(229,96,143,.55))}
.lock__crest svg path{fill:url(#gr-rose)}
.lock.is-success .lock__crest{box-shadow:0 0 70px rgba(255,110,170,.95),inset 0 2px 0 #fff;transform:scale(1.15)}
.lock__title{margin:22px 0 6px;font:italic 700 clamp(26px,7.4vw,33px)/1.15 var(--font-display);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.8)}
.lock__hint{margin:0;font-size:14px;color:var(--ink-soft);min-height:1.4em}
.dots{display:flex;gap:16px;margin-top:22px;height:18px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rose);background:rgba(255,255,255,.6);transition:transform .5s var(--spring),background .3s,box-shadow .3s,border-color .3s}
.dot.is-on{background:radial-gradient(circle at 35% 30%,#fff,#ff8cbc 55%,#e5608f);border-color:transparent;transform:scale(1.28);box-shadow:0 0 16px rgba(255,100,160,.85)}
.dots.is-error{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
.dots.is-error .dot.is-on{background:#ff4b73;box-shadow:0 0 16px rgba(255,60,100,.9)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.lock__msg{height:20px;margin:12px 0 0;font-size:13.5px;color:var(--rose-deep);opacity:0;transition:opacity .3s}
.lock__msg.is-on{opacity:1}

.numpad{--key:clamp(68px,20vw,84px);--gap:clamp(14px,4.2vw,20px);display:grid;grid-template-columns:repeat(3,var(--key));gap:var(--gap);margin-top:16px}
.key{
  position:relative;overflow:hidden;width:var(--key);height:var(--key);border-radius:50%;
  border:1px solid #fff;color:#7a2a52;font:400 clamp(26px,7.6vw,32px)/1 var(--font-body);
  background:linear-gradient(155deg,rgba(255,255,255,.98),rgba(255,224,237,.7));
  box-shadow:0 14px 26px -12px rgba(214,80,135,.6),inset 0 -3px 6px rgba(255,170,200,.4),inset 0 2px 0 #fff;
  display:grid;place-items:center;transition:transform .6s var(--spring),background .45s,box-shadow .45s,color .3s;will-change:transform;
}
.key.is-down{
  transform:scale(.85);transition-duration:.07s;color:#fff;
  background:linear-gradient(155deg,#ff9cc0,#e5608f);
  box-shadow:0 0 36px rgba(255,100,160,.75),inset 0 2px 0 rgba(255,255,255,.5);
}
.key svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.key--ghost{visibility:hidden;pointer-events:none}
.ripple{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,150,195,.5) 60%,transparent 70%);animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(9);opacity:0}}

/* Kính vỡ */
.lock__shards{position:absolute;inset:0;z-index:1}
.shard{position:absolute;left:0;top:0;background-image:var(--lock-bg);background-repeat:no-repeat;transform-origin:var(--ox) var(--oy);backface-visibility:hidden;will-change:transform,opacity}
.shard::after{content:'';position:absolute;inset:0;background:linear-gradient(var(--sa),rgba(255,255,255,.55),rgba(255,255,255,0) 58%)}
.lock.is-breaking .shard{animation:shardFly 1s var(--dl) cubic-bezier(.5,0,.9,.4) forwards}
@keyframes shardFly{
  0%{transform:translate3d(0,0,0);opacity:1}
  14%{transform:translate3d(calc(var(--tx)*.05),calc(var(--ty)*.05),24px);opacity:1}
  100%{transform:translate3d(var(--tx),var(--ty),var(--tz)) rotate3d(var(--rx),var(--ry),var(--rz),var(--ra)) scale(.55);opacity:0}
}
.lock__cracks{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 3px rgba(229,96,143,.9))}
.crack{fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:crackDraw .3s var(--cd) ease-out forwards}
@keyframes crackDraw{to{stroke-dashoffset:0}}
.lock.is-breaking .lock__cracks{animation:fadeOut .35s .45s forwards}
@keyframes fadeOut{to{opacity:0}}
.flash{
  position:fixed;inset:0;z-index:105;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--x) var(--y),#fff 0,rgba(255,225,238,.95) 8%,rgba(255,150,195,.55) 24%,transparent 58%);
  transform-origin:var(--x) var(--y);animation:flash 1.3s ease-out forwards;
}
@keyframes flash{0%{opacity:0;transform:scale(.2)}12%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.shock{
  position:fixed;left:0;top:0;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;pointer-events:none;z-index:110;
  background:radial-gradient(circle,transparent 56%,rgba(255,255,255,.95) 60%,rgba(255,100,160,.6) 67%,transparent 74%);
  animation:shock 1s var(--ease-out) forwards;
}
@keyframes shock{from{transform:translate(var(--x),var(--y)) scale(.1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(16);opacity:0}}

/* =====================================================================
   4. GIAI ĐOẠN 2: DASHBOARD
   ===================================================================== */
.dash{position:absolute;inset:0;z-index:10}
.dash.is-preunlock{opacity:0;visibility:hidden}
.dash.is-entering{animation:dashZoomIn 1.4s var(--ease-out) both}
@keyframes dashZoomIn{
  from{opacity:0;transform:scale(1.4);filter:blur(20px) brightness(1.5) saturate(1.3)}
  55%{opacity:1}
  to{opacity:1;transform:scale(1);filter:blur(0) brightness(1) saturate(1)}
}
.dash__scroll{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 124px)}
.dash__inner{max-width:520px;margin:0 auto}

.hero{border-radius:34px;padding:26px 18px 20px;text-align:center;will-change:transform}
.dash.is-revealed .hero{animation:heroIn 1s .45s var(--spring) backwards}
@keyframes heroIn{from{opacity:0;transform:translateY(28px) scale(.93)}}
.hero__names{margin:0;font:italic 700 24px/1.2 var(--font-display);color:var(--rose-deep)}
.hero__heart{display:inline-block;color:var(--rose);margin:0 6px;animation:heartbeat 1.6s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.28)}28%{transform:scale(1)}42%{transform:scale(1.18)}}
.hero__caption{margin:10px 0 0;font-size:14px;color:var(--ink-soft)}
.hero__days{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:4px}
.hero__num{
  font:italic 700 clamp(84px,27vw,128px)/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#ff6fa3 0%,#d43c7c 60%,#e08a86 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(255,255,255,.7)) drop-shadow(0 12px 22px rgba(229,96,143,.4));
}
.hero__unit{font:700 36px/1 var(--font-script);color:var(--rose-deep)}
.hero__span{margin:6px 0 16px;font-size:14px;color:var(--ink-soft);min-height:1.4em}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.clock__cell{padding:12px 6px 10px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.4));border:1px solid #fff;box-shadow:0 10px 20px -14px rgba(214,80,135,.6),inset 0 1px 0 #fff}
.clock__cell b{display:block;font:600 28px/1.1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--rose-deep)}
.clock__cell b.pop{animation:tickPop .45s var(--spring)}
@keyframes tickPop{from{transform:translateY(-7px) scale(1.14);color:#ff4b8a}}
.clock__cell span{font-size:12.5px;color:var(--ink-soft)}

/* Thẻ 3D */
.cards{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:152px;gap:14px;margin-top:16px;perspective:1100px}
.card3d{
  --rx:0deg;--ry:0deg;--s:1;--gx:50%;--gy:30%;
  position:relative;padding:0;border:0;background:none;text-align:left;border-radius:28px;
  transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));transform-style:preserve-3d;
  transition:transform .8s var(--spring);will-change:transform;
}
.card3d.is-down{transition:transform .09s ease-out}
.card3d--album{grid-row:1 / span 2}
.dash.is-revealed .card3d{animation:cardRise 1s calc(.7s + var(--i,0)*.12s) var(--spring) backwards}
@keyframes cardRise{from{opacity:0;transform:perspective(900px) translateY(64px) rotateX(-28deg) scale(.9)}}
.card3d__glass{
  position:absolute;inset:0;border-radius:inherit;background:var(--glass-bg);
  -webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 26px 40px -22px rgba(214,80,135,.65),inset 0 1px 0 #fff;
}
.card3d--album .card3d__glass{background:linear-gradient(150deg,rgba(255,160,198,.62),rgba(255,255,255,.4))}
.card3d--letter .card3d__glass{background:linear-gradient(150deg,rgba(150,200,255,.66),rgba(255,255,255,.4))}
.card3d--video .card3d__glass{background:linear-gradient(150deg,rgba(214,190,255,.68),rgba(255,232,214,.45))}
.card3d__glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .45s;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.85),transparent 58%);transform:translateZ(2px)}
.card3d.is-down .card3d__glare{opacity:1}
.card3d__body{position:absolute;inset:0;padding:16px;border-radius:inherit;display:flex;flex-direction:column;justify-content:flex-end;transform:translateZ(34px);transform-style:preserve-3d}
.card3d__icon{position:absolute;left:16px;top:16px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#fff,rgba(255,255,255,.55));border:1px solid #fff;box-shadow:0 10px 18px -8px rgba(80,40,90,.35),inset 0 1px 0 #fff;transform:translateZ(18px)}
.card3d__icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card3d__icon svg.solid{fill:currentColor;stroke:none}
.card3d--letter .card3d__icon{color:#2f6fd6}.card3d--video .card3d__icon{color:#8b5cd6}
.card3d__title{font:italic 700 22px/1.15 var(--font-display);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.card3d__sub{margin-top:3px;font-size:12.5px;color:var(--ink-soft)}
.stack{position:absolute;left:18px;right:18px;top:18px;bottom:82px;transform-style:preserve-3d;pointer-events:none}
.stack i{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.5) center/cover;border:3px solid #fff;border-bottom-width:12px;box-shadow:0 14px 24px -8px rgba(120,40,80,.5);transform:translate3d(var(--x),var(--y),var(--z)) rotate(var(--r))}
.dash__foot{margin:26px 0 0;text-align:center;font:700 22px/1 var(--font-script);color:var(--rose-deep)}

/* =====================================================================
   5. VIEW CHUNG
   ===================================================================== */
.view{
  position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  -webkit-clip-path:circle(0% at var(--ox,50%) var(--oy,50%));clip-path:circle(0% at var(--ox,50%) var(--oy,50%));
  transition:clip-path .8s var(--ease-out),-webkit-clip-path .8s var(--ease-out);
}
.view.is-open{-webkit-clip-path:circle(150% at var(--ox,50%) var(--oy,50%));clip-path:circle(150% at var(--ox,50%) var(--oy,50%))}
.view.is-instant{transition:none!important}
.view--light{background:radial-gradient(90% 38% at 50% 0%,#fff 0%,transparent 72%),linear-gradient(180deg,#fff2f8,#ffdcea 62%,#ffe8f1)}
.view--blue{background:radial-gradient(120% 60% at 50% 0%,#0f3f9a 0%,transparent 62%),linear-gradient(180deg,#061336,#020614)}
.view__hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.view__bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 14px) 16px 10px}
.view__title{margin:0;font:italic 700 26px/1.1 var(--font-display)}
.view--light .view__title{color:var(--ink)}
.view--blue .view__title{color:#cfe8ff;text-shadow:0 0 20px #2f8bff}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid #fff;background:linear-gradient(150deg,#fff,rgba(255,255,255,.55));box-shadow:0 10px 20px -10px rgba(214,80,135,.6),inset 0 1px 0 #fff;transition:transform .55s var(--spring)}
.back:active{transform:scale(.88);transition-duration:.08s}
.back svg{width:22px;height:22px;stroke:var(--rose-deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view--blue .back{background:rgba(60,140,255,.18);border-color:rgba(140,200,255,.6);box-shadow:0 0 22px rgba(47,139,255,.35),inset 0 1px 0 rgba(200,230,255,.5)}
.view--blue .back svg{stroke:#bfe0ff}
.view__body{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 14px calc(var(--sab) + 120px)}
.view:not(.is-revealed) .view__body{opacity:0}
.view.is-revealed .view__body{animation:fadeUp .7s .05s var(--ease-out) backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}}

/* Thanh chuyển chế độ */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:280px;margin:4px auto 16px;padding:4px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid #fff;box-shadow:0 10px 22px -14px rgba(214,80,135,.6),inset 0 1px 0 #fff}
.seg__thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(135deg,#ff9cc0,#e5608f);box-shadow:0 8px 18px -6px rgba(229,96,143,.8);transition:transform .6s var(--spring)}
.seg[data-active="portrait"] .seg__thumb,.seg[data-active="cover"] .seg__thumb{transform:translateX(100%)}
.seg__btn{position:relative;z-index:1;border:0;background:none;padding:10px 0;font:500 14px var(--font-body);color:var(--ink);transition:color .3s}
.seg[data-active="landscape"] .seg__btn:first-of-type,.seg[data-active="portrait"] .seg__btn:last-of-type,
.seg[data-active="grid"] .seg__btn:first-of-type,.seg[data-active="cover"] .seg__btn:last-of-type{color:#fff}

/* --- THƯ TÌNH (xanh neon) --- */
.lovewords{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.lw{position:absolute;left:var(--x);top:var(--y);font:600 var(--fs)/1 var(--font-body);color:#8fd0ff;text-shadow:0 0 10px #2f8bff,0 0 22px rgba(47,139,255,.6);opacity:0;animation:lw var(--dur) ease-in-out var(--dl) infinite}
@keyframes lw{0%,100%{opacity:0;transform:translateY(12px)}50%{opacity:var(--o);transform:translateY(-16px)}}
.letter{max-width:560px;margin:4px auto 0;perspective:1200px}
.nheart{display:block;width:150px;margin:0 auto -10px;overflow:visible;filter:drop-shadow(0 0 12px rgba(47,139,255,.8))}
.nheart path{fill:none;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.nheart__glow{stroke:#2f8bff;stroke-width:4.5;filter:blur(3px)}
.nheart__line{stroke:#a9dcff;stroke-width:1.6}
.nheart__fill{fill:rgba(60,140,255,.16)!important;stroke:none!important;stroke-dasharray:none!important;opacity:0}
.nheart text{font:italic 500 11px var(--font-display);fill:#e2f1ff;text-anchor:middle;opacity:0}
.view.is-revealed .nheart path:not(.nheart__fill){animation:draw 2.4s .2s var(--ease-out) forwards}
.view.is-revealed .nheart__fill{animation:fadeIn 1s 1.6s forwards}
.view.is-revealed .nheart text{animation:fadeIn 1s 2s forwards}
.view.is-revealed .nheart{animation:heartbeat 1.8s 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.paper{
  position:relative;padding:34px 24px 30px;border-radius:28px;transform-origin:top center;
  background:linear-gradient(160deg,rgba(30,90,200,.5),rgba(6,26,80,.62));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(140,200,255,.55);
  box-shadow:0 0 44px rgba(47,139,255,.35),0 30px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(200,230,255,.55);
}
.view.is-revealed .paper{animation:unfold 1.1s .5s var(--ease-out) backwards}
@keyframes unfold{from{transform:rotateX(-80deg);opacity:0}}
.paper__title{margin:0 0 14px;text-align:center;font:italic 700 26px/1.2 var(--font-display);color:#a9dcff;text-shadow:0 0 16px rgba(47,139,255,.9)}
.paper .line{font:600 22px/1.55 var(--font-script);margin:0 0 14px;color:#e6f3ff;text-shadow:0 0 12px rgba(80,160,255,.45)}
.paper .line--close{margin-top:22px;margin-bottom:0;color:#a9dcff}
.paper .line--sign{text-align:right;margin:6px 0 0;font-size:30px;color:#8fd0ff}
.view.is-revealed .paper .line{animation:lineIn .9s calc(1.3s + var(--n)*.5s) var(--ease-out) backwards}
@keyframes lineIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}

/* --- ALBUM: Masonry --- */
.masonry{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;max-width:720px;margin:0 auto}
.masonry__col{display:flex;flex-direction:column;gap:10px}
.tile{
  position:relative;margin:0;border-radius:20px;overflow:hidden;cursor:pointer;border:3px solid #fff;
  background:linear-gradient(110deg,rgba(255,255,255,.5) 30%,rgba(255,255,255,.9) 50%,rgba(255,255,255,.5) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;
  opacity:0;transform:perspective(700px) translateY(34px) rotateX(16deg);
  transition:transform .9s var(--spring),opacity .6s;box-shadow:0 16px 28px -14px rgba(180,60,110,.55);
}
.tile.in{opacity:1;transform:none}
.tile.in.is-down{transform:scale(.95);transition-duration:.09s}
.tile.is-loaded{animation:none;background:#fff}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s;pointer-events:none}
.tile.is-loaded img{opacity:1}
@keyframes shimmer{to{background-position:-200% 0}}

/* --- ALBUM: Coverflow 3D --- */
.cf{max-width:720px;margin:0 auto}
.cf.swap{animation:swap .6s var(--spring)}
@keyframes swap{from{transform:scale(.94);opacity:.4}}
.cf__stage{position:relative;height:min(58vh,470px);height:min(58dvh,470px);perspective:900px;touch-action:none;overflow:visible;cursor:grab}
.cf__item{
  position:absolute;left:50%;top:50%;width:min(62vw,280px);aspect-ratio:3/4;margin:0;border-radius:22px;overflow:hidden;
  border:4px solid #fff;background:#fff;box-shadow:0 26px 40px -16px rgba(150,40,90,.6);will-change:transform;
  -webkit-box-reflect:below 8px linear-gradient(transparent 72%,rgba(255,255,255,.35));
}
.cf__item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cf__cap{margin:22px auto 0;width:max-content;max-width:90%;padding:10px 18px;border-radius:999px;text-align:center;font:italic 600 16px/1.3 var(--font-display);color:var(--ink)}

/* --- VIDEO --- */
.player{position:relative;margin:0 auto 18px;width:100%;max-width:720px;aspect-ratio:16/9;border-radius:26px;overflow:hidden;background:#2a0f20;border:4px solid #fff;box-shadow:0 26px 44px -18px rgba(150,40,90,.6)}
.player[data-orient="portrait"]{aspect-ratio:9/16;width:min(100%,calc(62vh*9/16));width:min(100%,calc(62dvh*9/16))}
.player.swap{animation:swap .6s var(--spring)}
.player video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.player__empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;font-size:14px;pointer-events:none}
.vlist{list-style:none;margin:0 auto;padding:0;display:grid;gap:12px;max-width:720px}
.vitem{width:100%;display:flex;align-items:center;gap:14px;padding:10px;border-radius:24px;text-align:left;background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,255,255,.5));border:1px solid #fff;box-shadow:0 14px 26px -16px rgba(200,70,120,.6),inset 0 1px 0 #fff;transition:transform .6s var(--spring),background .3s}
.vitem.is-down{transform:scale(.96);transition-duration:.08s}
.vitem.is-active{background:linear-gradient(150deg,rgba(255,170,205,.85),rgba(255,235,244,.7))}
.vitem__thumb{position:relative;flex:none;width:104px;height:64px;border-radius:16px;background:#f3c9da center/cover no-repeat;overflow:hidden}
.vitem[data-orient="portrait"] .vitem__thumb{width:64px;height:96px}
.vitem__thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(80,10,40,.4))}
.vitem__thumb svg{position:absolute;z-index:1;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.vitem__title{display:block;font:600 15px/1.3 var(--font-body);color:var(--ink)}
.vitem__desc{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-soft)}

/* =====================================================================
   6. LIGHTBOX
   ===================================================================== */
.lightbox{position:fixed;inset:0;z-index:80;touch-action:none;overscroll-behavior:none}
.lightbox__backdrop{position:absolute;inset:0;background:rgba(70,20,50,.55);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);opacity:0;transition:opacity .5s}
.lightbox.is-open .lightbox__backdrop{opacity:1}
.lightbox__stage{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--sat) + 64px) 0 calc(var(--sab) + 96px)}
.lightbox__frame{
  --ratio:.75;width:min(92vw,calc(70vh*var(--ratio)));width:min(92vw,calc(70dvh*var(--ratio)));aspect-ratio:var(--ratio);
  border-radius:22px;overflow:hidden;background:#fff;border:4px solid #fff;
  box-shadow:0 34px 80px -10px rgba(60,10,40,.7);will-change:transform;
}
.lightbox__frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transform-origin:50% 50%;will-change:transform}
.lightbox__ui{opacity:0;transition:opacity .45s .3s}
.lightbox.is-open .lightbox__ui{opacity:1}
.lightbox__foot{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 26px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 20px;text-align:center;pointer-events:none}
.lightbox__caption{margin:0;padding:10px 18px;border-radius:999px;font:italic 600 16px/1.3 var(--font-display);max-width:90vw;color:var(--ink)}
.lightbox__count{font-size:12.5px;color:#fff}
.lightbox__close,.lightbox__nav{border:1px solid #fff;background:linear-gradient(150deg,#fff,rgba(255,255,255,.6));box-shadow:0 10px 22px -10px rgba(0,0,0,.4)}
.lightbox__close{position:absolute;top:calc(var(--sat) + 14px);right:16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.lightbox__close svg,.lightbox__nav svg{width:20px;height:20px;stroke:var(--rose-deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lightbox__nav{display:none}
@media (hover:hover) and (pointer:fine){
  .lightbox__nav{display:grid;place-items:center;position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%}
  .lightbox__nav--prev{left:18px}.lightbox__nav--next{right:18px}
}

/* =====================================================================
   7. MINI PLAYER (đĩa than)
   ===================================================================== */
.mini{position:fixed;left:50%;bottom:calc(var(--sab) + 14px);z-index:60;width:min(92vw,440px);height:66px;padding:0 12px 0 8px;border-radius:999px;display:flex;align-items:center;gap:10px;transform:translateX(-50%);transition:transform .9s var(--spring),opacity .5s}
.mini.is-hidden{transform:translate(-50%,150%);opacity:0;pointer-events:none}
.mini__disc{position:relative;flex:none;width:52px;height:52px;border:0;background:none;padding:0;border-radius:50%}
.mini__ring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none}
.mini__ring circle{fill:none;stroke-width:2.4}
.ring-bg{stroke:rgba(229,96,143,.2)}
.ring-fg{stroke:var(--rose);stroke-linecap:round;stroke-dasharray:157.08;stroke-dashoffset:157.08;transition:stroke-dashoffset .4s linear}
.vinyl{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3a1230 0 30%,transparent 31%),repeating-radial-gradient(circle at 50% 50%,#1f0819 0 1.5px,#3b1431 1.5px 3px);box-shadow:0 8px 16px -4px rgba(120,30,80,.6),inset 0 0 0 1px rgba(255,255,255,.2);animation:spin 5.5s linear infinite;animation-play-state:paused}
.vinyl::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 18%,rgba(255,255,255,.4) 25%,transparent 32% 68%,rgba(255,255,255,.4) 75%,transparent 82%)}
.vinyl__label{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3d6,#ffb3cd 55%,#e5608f);box-shadow:0 0 0 2px #3a1230}
.vinyl__label::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#3a1230}
.mini.is-playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.mini__info{flex:1;min-width:0}
.mini__title{margin:0;font:600 14px/1.25 var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini__artist{margin:2px 0 0;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini__ctrl{display:flex;align-items:center;gap:2px}
.mini__ctrl button{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--spring)}
.mini__ctrl button:active{transform:scale(.8);transition-duration:.07s}
.mini__ctrl svg{width:22px;height:22px;fill:var(--rose-deep)}
.mini__ctrl .mini__play{background:linear-gradient(135deg,#ff9cc0,#e5608f);box-shadow:0 8px 16px -6px rgba(229,96,143,.8)}
.mini__ctrl .mini__play svg{fill:#fff}

/* =====================================================================
   8. HIỆU ỨNG CHUYỂN CẢNH ĐIỆN ẢNH (Thư tình / Album)
   ===================================================================== */
.tx{position:fixed;inset:0;z-index:115;background:#02040c;opacity:0;transition:opacity .35s ease-out;touch-action:manipulation}
.tx--pink{background:#12050c}
.tx.is-in{opacity:1}
.tx.is-out{transition-duration:.9s}
.tx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tx__skip{position:absolute;left:50%;bottom:calc(var(--sab) + 28px);transform:translateX(-50%);padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font:400 13px var(--font-body)}

/* =====================================================================
   9. TIỆN ÍCH
   ===================================================================== */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 18px);z-index:130;max-width:88vw;padding:12px 18px;border-radius:999px;font-size:13.5px;text-align:center;color:var(--ink);background:rgba(255,255,255,.9);border:1px solid #fff;box-shadow:0 14px 30px -10px rgba(200,60,120,.5);transform:translate(-50%,-160%);transition:transform .6s var(--spring)}
.toast.is-on{transform:translate(-50%,0)}
@media (min-width:700px){.cards{grid-auto-rows:170px}.paper .line{font-size:25px}}
@media (prefers-reduced-motion:reduce){
  .blob,.vinyl,.hero__heart,.tile,.pheart__in,.spark,.pearl,.mesh__sheen,.lw{animation:none!important}
  .view{transition-duration:.01s}.dash.is-entering{animation-duration:.4s}
}
/* =====================================================================
   GHI ĐÈ MÀU THƯ TÌNH: XANH NEON → HỒNG ĐÀO NHẠT
   Chỉ đổi màu, không đổi bố cục hoặc hiệu ứng
   ===================================================================== */

/* Nền màn thư tình */

.view--blue {
  background:
    radial-gradient(
      100% 55% at 50% 0%,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 224, 232, 0.72) 40%,
      transparent 72%
    ),
    linear-gradient(
      180deg,
      #fff3f6 0%,
      #ffdce4 52%,
      #ffc8d5 100%
    );
}

/* Tiêu đề Thư tình */

.view--blue .view__title {
  color: #a83f68;

  text-shadow:
    0 0 12px rgba(255, 255, 255, 0.9),
    0 0 22px rgba(244, 127, 160, 0.45);
}

/* Nút quay lại */

.view--blue .back {
  background:
    linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.94),
      rgba(255, 218, 228, 0.76)
    );

  border-color:
    rgba(255, 255, 255, 0.94);

  box-shadow:
    0 10px 22px rgba(197, 69, 112, 0.18),
    inset 0 1px 0 #ffffff;
}

.view--blue .back svg {
  stroke: #b83d6d;
}

/* Chữ I love you bay phía sau */

.lw {
  color: #e76894;

  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.95),
    0 0 15px rgba(255, 134, 172, 0.74),
    0 0 27px rgba(244, 127, 160, 0.42);
}

/* Trái tim phía trên lá thư */

.nheart {
  filter:
    drop-shadow(
      0 0 12px
      rgba(255, 120, 164, 0.85)
    )
    drop-shadow(
      0 0 26px
      rgba(255, 174, 196, 0.54)
    );
}

.nheart__glow {
  stroke: #ff79a5;

  filter: blur(3px);
}

.nheart__line {
  stroke: #d94f83;
}

.nheart__fill {
  fill:
    rgba(
      255,
      151,
      181,
      0.2
    ) !important;
}

.nheart text {
  fill: #a83f68;

  text-shadow:
    0 0 10px
    rgba(255, 255, 255, 0.9);
}

/* Tờ thư kính hồng đào */

.paper {
  background:
    linear-gradient(
      160deg,
      rgba(255, 255, 255, 0.8),
      rgba(255, 223, 231, 0.72)
    );

  border:
    1px solid
    rgba(255, 255, 255, 0.95);

  box-shadow:
    0 0 40px
    rgba(244, 127, 160, 0.27),

    0 30px 60px -20px
    rgba(145, 44, 82, 0.32),

    inset 0 1px 0
    rgba(255, 255, 255, 0.95);

  color: #6f2848;
}

    if (Math.hypot(x - sx, y - sy) > TOL) { active = false; if (h.cancel) h.cancel(e); return; }
    if (h.move) h.move(x, y, e);

  const finish = (x, y, e) => { if (!active) return; active = false; if (h.up) h.up(x, y, e); };
  const abort = e => { if (!active) return; active = false; if (h.cancel) h.cancel(e); };
  el.addEventListener('touchstart', e => { lastTouch = Date.now(); const t = e.changedTouches[0]; begin(t.clientX, t.clientY, e); }, { passive: true });
  el.addEventListener('touchmove',  e => { const t = e.changedTouches[0]; track(t.clientX, t.clientY, e); }, { passive: true });
  el.addEventListener('touchend',   e => {
    lastTouch = Date.now(); const t = e.changedTouches[0]; const was = active;
    finish(t.clientX, t.clientY, e);

  el.addEventListener('touchcancel', abort, { passive: true });
  el.addEventListener('mousedown', e => {
    if (e.button !== 0 || Date.now() - lastTouch < 800) return;
    begin(e.clientX, e.clientY, e);
    const mv = ev => track(ev.clientX, ev.clientY, ev);
    const up = ev => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); finish(ev.clientX, ev.clientY, ev); };

/* =====================================================================
   PARALLAX: cuộn trang + con quay (Android) + ngón tay
   ===================================================================== */
const Parallax = (() => {
  const root = document.documentElement;
  let gx = 0, gy = 0, tx = 0, ty = 0, raf = 0;
  function step() {
    gx += (tx - gx) * .08; gy += (ty - gy) * .08;
    root.style.setProperty('--gx', gx.toFixed(2)); root.style.setProperty('--gy', gy.toFixed(2));
    raf = (Math.abs(tx - gx) > .05 || Math.abs(ty - gy) > .05) ? requestAnimationFrame(step) : 0;
  }
  function target(x, y) { tx = x; ty = y; if (!raf) raf = requestAnimationFrame(step); }
  function scroll(v) { root.style.setProperty('--sy', v); }
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    target((t.clientX / window.innerWidth - .5) * -26, (t.clientY / window.innerHeight - .5) * -26);
  }, { passive: true });
  document.addEventListener('touchend', () => target(0, 0), { passive: true });
  /* Con quay hồi chuyển: chỉ bật khi không cần xin quyền (Android/desktop), tránh hộp thoại trên iOS */
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission !== 'function' && !reduceMotion) {
    let base = null;
    window.addEventListener('deviceorientation', e => {
      if (e.gamma == null || e.beta == null) return;
      if (base === null) base = e.beta;
      target(clamp(e.gamma, -25, 25) * -.9, clamp(e.beta - base, -25, 25) * -.9);
    });
  }
  return { scroll, target };
})();

/* =====================================================================
   FX: hạt lấp lánh và trái tim (canvas độ phân giải cao)
   ===================================================================== */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  const COLORS = ['#ff5c98', '#ff8db6', '#e6a08a', '#c79bff', '#ffb84d', '#ff7fae', '#ffffff'];
  let parts = [], raf = 0, W = 0, H = 0, lastTrail = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); window.addEventListener('resize', resize);
  const pick = () => COLORS[(Math.random() * COLORS.length) | 0];
  function push(p) { parts.push(p); if (!raf) raf = requestAnimationFrame(loop); }
  function burst(x, y, o = {}) {
    if (reduceMotion) return;
    const count = o.count || 60, speed = o.speed || 9, hearts = o.hearts == null ? .4 : o.hearts;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (.35 + Math.random() * .9);
      push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 0, max: 55 + Math.random() * 65, size: 3 + Math.random() * 6, color: pick(), heart: Math.random() < hearts, rot: Math.random() * 6, vr: (Math.random() - .5) * .2, g: .17 });
    }
  }
  /* Vệt sáng theo ngón tay */
  function trail(x, y) {
    if (reduceMotion) return;
    const now = performance.now(); if (now - lastTrail < 34) return; lastTrail = now;
    for (let i = 0; i < 2; i++) push({ x: x + (Math.random() - .5) * 8, y: y + (Math.random() - .5) * 8, vx: (Math.random() - .5) * 1.2, vy: -Math.random() * 1.2 - .2, life: 0, max: 26 + Math.random() * 22, size: 2 + Math.random() * 3.5, color: pick(), heart: Math.random() < .45, rot: Math.random() * 6, vr: (Math.random() - .5) * .15, g: .02 });
  }
  function loop() {
    ctx.clearRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of parts) {
      p.life++; p.vx *= .972; p.vy = p.vy * .972 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      const k = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, k); ctx.fillStyle = p.color;
      if (p.heart) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * .3); ctx.font = (p.size * 2.6) + 'px serif'; ctx.fillText('\u2665', 0, 0); ctx.restore(); }

    }
    parts = parts.filter(p => p.life < p.max); ctx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; ctx.clearRect(0, 0, W, H); }
  }
  return { burst, trail };
})();

    mini.classList.toggle('is-playing', playing);
    playBtn.innerHTML = playing ? ICON.pause : ICON.play;
    playBtn.setAttribute('aria-label', playing ? 'Tạm dừng nhạc' : 'Phát nhạc');

    const t = PLAYLIST[idx];

    ring.style.strokeDashoffset = CIRC;
    if (autoplay) play();
  }
  function play() {
    const p = audio.play();
    if (p && p.catch) p.catch(() => { setUI(false); toast('Chạm vào đĩa nhạc để phát nhạc nền'); });
  }
  const pause = () => audio.pause();
  const toggle = () => { audio.paused ? play() : pause(); };
  const next = () => load(idx + 1, true);
  const prev = () => load(idx - 1, true);
  function duck(on) {
    if (on) { resumeAfterDuck = !audio.paused; if (resumeAfterDuck) audio.pause(); }
    else if (resumeAfterDuck) { resumeAfterDuck = false; play(); }
  }
  audio.addEventListener('play', () => setUI(true));
  audio.addEventListener('pause', () => setUI(false));
  audio.addEventListener('ended', next);
  audio.addEventListener('error', () => { setUI(false); toast('Không tải được bài nhạc, hãy kiểm tra đường dẫn'); });
  audio.addEventListener('timeupdate', () => {
    if (audio.duration && isFinite(audio.duration)) ring.style.strokeDashoffset = CIRC * (1 - audio.currentTime / audio.duration);
  });
  $('#miniDisc').addEventListener('click', toggle);
  playBtn.addEventListener('click', toggle);
  $('#miniNext').addEventListener('click', next);
  $('#miniPrev').addEventListener('click', prev);

  /* Vuốt ngang mini player để chuyển bài */
  let sx = 0, sy = 0, dx = 0, dragging = false;
  mini.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0; dragging = false; }, { passive: true });
  mini.addEventListener('touchmove', e => {
    const t = e.touches[0]; dx = t.clientX - sx; const dy = t.clientY - sy;
    if (!dragging && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) dragging = true;
    if (dragging) { info.style.transition = 'none'; info.style.transform = 'translateX(' + (dx * .5) + 'px)'; info.style.opacity = String(1 - Math.min(.7, Math.abs(dx) / 220)); }
  }, { passive: true });
  mini.addEventListener('touchend', () => {
    if (dragging) {
      swallowClick = true; setTimeout(() => { swallowClick = false; }, 350);
      if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); vibrate(10); }
      info.style.transition = 'transform .6s var(--spring),opacity .4s'; info.style.transform = ''; info.style.opacity = '';
    }
    dragging = false;
  });
  mini.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);

  load(0, false); setUI(false);
  return { play, pause, toggle, duck, show: () => mini.classList.remove('is-hidden') };

/* =====================================================================
   BỘ ĐẾM NGÀY YÊU
   ===================================================================== */
const Counter = (() => {
  const $days = $('#daysBig'), $h = $('#cH'), $m = $('#cM'), $s = $('#cS'), $span = $('#spanText');
  const startDate = new Date(LOVE_START_DATE);
  let counting = true, timer = 0;
  if (isNaN(startDate.getTime())) console.warn('LOVE_START_DATE không hợp lệ. Dùng định dạng YYYY-MM-DDTHH:mm:ss');

  function calendarSpan(from, to) {
    let y = to.getFullYear() - from.getFullYear(), m = to.getMonth() - from.getMonth(), d = to.getDate() - from.getDate();
    if (d < 0) { m--; d += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    const out = [];
    if (y) out.push(y + ' năm'); if (m) out.push(m + ' tháng'); if (d) out.push(d + ' ngày');
    return out.join(' ') || 'Mới bắt đầu thôi';
  }
  function snapshot() {
    const now = new Date(); let diff = Math.max(0, now - startDate);
    const days = Math.floor(diff / 864e5); diff -= days * 864e5;
    const h = Math.floor(diff / 36e5); diff -= h * 36e5;
    const m = Math.floor(diff / 6e4); diff -= m * 6e4;
    return { days, h, m, s: Math.floor(diff / 1000), now };
  }
  function render() {
    const { days, h, m, s, now } = snapshot();
    if (!counting) $days.textContent = days.toLocaleString('vi-VN');
    $h.textContent = pad2(h); $m.textContent = pad2(m);
    if ($s.textContent !== pad2(s)) { $s.textContent = pad2(s); $s.classList.remove('pop'); void $s.offsetWidth; $s.classList.add('pop'); }
    $span.textContent = now < startDate ? 'Ngày ấy còn ở phía trước' : calendarSpan(startDate, now);
  }
  function countUp(target) {
    const t0 = performance.now(), D = 1800;
    (function frame(t) {
      const p = clamp((t - t0) / D, 0, 1), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
      $days.textContent = Math.round(target * e).toLocaleString('vi-VN');
      if (p < 1) requestAnimationFrame(frame); else counting = false;
    })(t0);
  }
  function start() { render(); countUp(snapshot().days); clearInterval(timer); timer = setInterval(render, 1000); }
  return { start };
})();

/* =====================================================================
   CHUYỂN CẢNH ĐIỆN ẢNH
   - 'blue': trái tim xanh neon ghép từ chữ "I love you" (cho Thư tình)
   - 'pink': trái tim hồng hạt bụi có sao chổi quét viền (cho Album)

const Transition = (() => {
  const root = $('#tx'), cv = $('#txCanvas'), ctx = cv.getContext('2d');

    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* Hình học trái tim: đường viền tham số, lấy mẫu đều theo độ dài cung, kèm pháp tuyến */
  function heartPoly(cx, cy, k, n = 260) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = Math.PI + i / n * Math.PI * 2;
      pts.push([cx + k * 16 * Math.pow(Math.sin(t), 3), cy - k * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
    }

  }

    const n = pts.length, cum = [0];
    for (let i = 1; i <= n; i++) { const a = pts[i - 1], b = pts[i % n]; cum[i] = cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]); }
    const total = cum[n], out = []; let j = 0;
    for (let i = 0; i < m; i++) {
      const d = i / m * total;
      while (cum[j + 1] < d) j++;
      const a = pts[j], b = pts[(j + 1) % n], f = (d - cum[j]) / (cum[j + 1] - cum[j] || 1);
      out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, 0, 0]);
    }
    for (let i = 0; i < m; i++) {
      const p = out[(i - 1 + m) % m], q = out[(i + 1) % m];
      const tx = q[0] - p[0], ty = q[1] - p[1], l = Math.hypot(tx, ty) || 1;

  }

    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if (((a[1] > y) !== (b[1] > y)) && (x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0])) c = !c;
    }

  }

  /* ---------- Hiệu ứng XANH: trái tim chữ "I love you" ---------- */
  function makeBlue() {
    const T_OUT = TRANSITION_LETTER_SECONDS;
    const TEXTS = ['I love you', 'LOVE YOU', 'love you', 'I Love You', 'I LOVE YOU'];
    const SIZES = [9, 11, 13, 16, 20, 25];
const COLORS = [
  { fill: '#fff8fa', glow: '#ff9ab8' },
  { fill: '#ffb8c8', glow: '#f47fa0' },
  { fill: '#e86692', glow: '#ffadc2' }
];    const S = Math.min(W * .44, H * .3), k = S / 16;
    const cx = W / 2, cy = H * .44 - 2.6 * k;
    const poly = heartPoly(cx, cy, k), path = lut(poly, 700);

    poly.forEach(p => { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; });

    const cache = {};
    function sprite(ti, si, ci) {
      const key = ti + '|' + si + '|' + ci;
      if (cache[key]) return cache[key];
      const size = SIZES[si], c = document.createElement('canvas'), g = c.getContext('2d');
      const font = '600 ' + (size * dpr) + 'px "Be Vietnam Pro", Arial, sans-serif';
      g.font = font;
      const w = Math.ceil(g.measureText(TEXTS[ti]).width), pd = Math.ceil(size * dpr * .9);
      c.width = w + pd * 2; c.height = Math.ceil(size * dpr * 1.5) + pd * 2;
      g.font = font; g.textBaseline = 'middle'; g.textAlign = 'center';
      const col = COLORS[ci];
      g.shadowColor = col.glow; g.shadowBlur = size * dpr * .8; g.fillStyle = col.fill;
      g.fillText(TEXTS[ti], c.width / 2, c.height / 2);
      g.shadowBlur = size * dpr * .25; g.fillText(TEXTS[ti], c.width / 2, c.height / 2);
      return (cache[key] = { c, w: c.width / dpr, h: c.height / dpr });
    }
    const pickSize = () => { const r = Math.random(); return r < .18 ? 0 : r < .4 ? 1 : r < .62 ? 2 : r < .8 ? 3 : r < .93 ? 4 : 5; };
    const mk = (x, y, at) => ({ x, y, at, ti: (Math.random() * TEXTS.length) | 0, si: pickSize(), ci: (Math.random() * COLORS.length) | 0, ph: Math.random() * 6.28, sp: .8 + Math.random() * 2, amp: 1 + Math.random() * 4, al: .55 + Math.random() * .45, gh: Math.random() < .35 });

    const items = [], N1 = clamp(Math.round(W / 2.3), 120, 200), N2 = clamp(Math.round(W * .7), 150, 300);
    for (let i = 0; i < N1; i++) {         /* viền: được "vẽ" dần theo đường tim */
      const u = i / N1, p = path[Math.floor(u * path.length)], j = (Math.random() - .5) * k * 1.4;
      items.push(mk(p[0] + p[2] * j, p[1] + p[3] * j, .15 + u * 1.4 + Math.random() * .05));
    }
    let guard = 0;
    while (items.length < N1 + N2 && guard++ < 6000) {   /* lấp đầy: quét từ trên xuống */
      const x = cx + (Math.random() * 2 - 1) * S * 1.02, y = minY + Math.random() * (maxY - minY);
      if (!inside(poly, x, y)) continue;
      items.push(mk(x, y, 1 + (y - minY) / (maxY - minY) * 1.5 + Math.random() * .25));
    }
    items.forEach(it => sprite(it.ti, it.si, it.ci));   /* dựng sẵn sprite để không giật */

    return {
      tOut: T_OUT,
      draw(t) {
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        ctx.fillStyle = '#02040c'; ctx.fillRect(0, 0, W, H);
        const q = clamp((t - T_OUT) / 1, 0, 1), fade = 1 - clamp((q - .3) / .6, 0, 1);
        let sc = 1;
        if (t > 2.7 && t < T_OUT) sc = 1 + .035 * Math.max(0, Math.sin((t - 2.7) * 7));
        if (q > 0) sc *= 1 + q * q * q * 9;
        const gl = ctx.createRadialGradient(cx, cy + k, 0, cx, cy + k, S * 1.7);
        gl.addColorStop(0, 'rgba(24,90,220,' + (.24 * clamp(t / 1.5, 0, 1) * fade) + ')'); gl.addColorStop(1, 'rgba(2,4,12,0)');
        ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);

        ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
        for (const it of items) {
          if (t < it.at) continue;
          const a = clamp((t - it.at) / .28, 0, 1), pop = .85 + .15 * a, dx = Math.sin(t * it.sp + it.ph) * it.amp;
          const sp = sprite(it.ti, it.si, it.ci), w = sp.w * pop, h = sp.h * pop;

          ctx.font = 'italic 500 ' + Math.round(S * .36) + 'px "Playfair Display", serif';
          ctx.shadowColor = '#2a86ff'; ctx.shadowBlur = 24; ctx.fillStyle = 'rgba(222,236,255,.9)';

        }
        ctx.restore(); ctx.globalAlpha = 1;
        if (q > .25) { const f = clamp((q - .25) / .55, 0, 1); ctx.fillStyle = 'rgba(140,200,255,' + (f * .92) + ')'; ctx.fillRect(0, 0, W, H); }
      }
    };
  }

  /* ---------- Hiệu ứng HỒNG: trái tim hạt bụi ---------- */
  function makePink() {
    const T_OUT = TRANSITION_ALBUM_SECONDS, TR = 2.0, T_HOLD = TR + 1.0;
    const COLS = ['#ff8fb8', '#ff6fa3', '#ffb3cf', '#ff9ec4', '#ffd0e2'];
    const S = Math.min(W * .44, H * .3), k = S / 16;
    const cx = W / 2, cy = H * .44 - 2.6 * k;
    const path = lut(heartPoly(cx, cy, k), 1400);
    const N = clamp(Math.round(W * H / 55), 3800, 7200);
    const parts = [];
    for (let i = 0; i < N; i++) {
      const u = Math.random(), P = path[Math.floor(u * path.length) % path.length];
      const off = (Math.random() + Math.random() + Math.random() - 1.5) * k * 1.5;
      const px = P[0] + P[2] * off, py = P[1] + P[3] * off;
      parts.push({ dl: u * TR + Math.random() * .12, du: .9 + Math.random() * .9, rf: 1.35 + Math.random() * 1.3, a0: .9 + Math.random() * 2.2, sz: .9 + Math.random() * 1.7, ph: Math.random() * 6.28, c: (Math.random() * COLS.length) | 0, dx: px - cx, dy: py - cy });
    }
    parts.sort((a, b) => a.c - b.c);

    return {
      tOut: T_OUT,
      draw(t) {
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        ctx.fillStyle = '#12050c'; ctx.fillRect(0, 0, W, H);
        const q = clamp((t - T_OUT) / 1, 0, 1), qq = q * q, fade = 1 - clamp((q - .15) / .6, 0, 1);
        ctx.globalCompositeOperation = 'lighter';
        let cur = '';
        for (const p of parts) {
          const tau = (t - p.dl) / p.du;
          if (tau <= 0) continue;
          const e = tau >= 1 ? 1 : 1 - Math.pow(1 - tau, 3), sw = 1 - e;
          const ang = p.a0 * sw, rad = 1 + (p.rf - 1) * sw, cs = Math.cos(ang), sn = Math.sin(ang);
          let x = cx + (p.dx * cs - p.dy * sn) * rad, y = cy + (p.dx * sn + p.dy * cs) * rad;
          if (t > T_HOLD) { x += Math.sin(t * 2.2 + p.ph) * .9; y += Math.cos(t * 2.6 + p.ph) * .9; }
          if (q > 0) { x += p.dx * qq * 2.2; y += p.dy * qq * 2.2; }
          const col = tau < .22 ? '#ffeaf3' : COLS[p.c];
          if (col !== cur) { ctx.fillStyle = col; cur = col; }
          ctx.globalAlpha = Math.min(1, tau * 4) * fade * (.8 + .2 * Math.sin(t * 3 + p.ph));
          ctx.fillRect(x, y, p.sz, p.sz);
        }
        ctx.globalAlpha = 1;
        if (t < TR + .4) {   /* đầu sao chổi phát sáng */
          const hu = clamp(t / TR, 0, 1), hp = path[Math.min(path.length - 1, Math.floor(hu * path.length))], ha = 1 - clamp((t - TR) / .4, 0, 1);
          const g = ctx.createRadialGradient(hp[0], hp[1], 0, hp[0], hp[1], 26);
          g.addColorStop(0, 'rgba(255,255,255,' + ha + ')'); g.addColorStop(.35, 'rgba(255,150,195,' + ha * .6 + ')'); g.addColorStop(1, 'rgba(255,90,150,0)');
          ctx.fillStyle = g; ctx.fillRect(hp[0] - 26, hp[1] - 26, 52, 52);
        }
        ctx.globalCompositeOperation = 'source-over';
        if (q > .1) {   /* bùng sáng hồng để dẫn vào album */
          const f = clamp((q - .1) / .7, 0, 1), R = Math.hypot(W, H) * .95 * f + 1;
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
          g.addColorStop(0, 'rgba(255,244,249,' + f + ')'); g.addColorStop(.6, 'rgba(255,205,224,' + f * .92 + ')'); g.addColorStop(1, 'rgba(255,205,224,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
      }

  }

  function end() {
    cancelAnimationFrame(raf); raf = 0;
    root.hidden = true; root.className = 'tx'; busy = false; eff = null;
    ctx.clearRect(0, 0, W, H);
  }
  function play(kind, cb) {
    if (busy) return;
    busy = true; fit();
    eff = kind === 'blue' ? makeBlue() : makePink();
    root.className = 'tx tx--' + (kind === 'blue' ? 'blue' : 'pink');
    root.hidden = false; void root.offsetWidth; root.classList.add('is-in');

  window.addEventListener('resize', () => { if (busy) end(); });
  return { play, get busy() { return busy; } };
})();

/* =====================================================================
   VIEW MANAGER
   ===================================================================== */
const Views = (() => {
  let current = null, opener = null;

  function open(name, ox, oy, opts = {}) {
    const v = $('#view-' + name);
    if (!v || current) return;
    current = v;
    v.classList.remove('is-revealed');
    v.style.setProperty('--ox', ox + 'px'); v.style.setProperty('--oy', oy + 'px');
    v.hidden = false;
    if (opts.instant) v.classList.add('is-instant');
    void v.offsetWidth;
    v.classList.add('is-open');
    if (opts.instant) requestAnimationFrame(() => requestAnimationFrame(() => v.classList.remove('is-instant')));
    document.body.classList.add('has-view');
    opener = document.activeElement;
    v.dispatchEvent(new Event('view:open'));
    if (!opts.gate) {
      v.classList.add('is-revealed'); v.dispatchEvent(new Event('view:reveal'));
      FX.burst(ox, oy, { count: 34, speed: 7 });
    }
    const b = $('.back', v); if (b) b.focus({ preventScroll: true });
  }
  function reveal(name) {
    const v = $('#view-' + name); if (!v) return;
    v.classList.add('is-revealed'); v.dispatchEvent(new Event('view:reveal'));
  }
  /* Thư tình / Album: chiếu hiệu ứng điện ảnh rồi mới hiện nội dung */
  function openCinematic(name, kind, ox, oy) {
    if (current || Transition.busy) return;
    if (reduceMotion) { open(name, ox, oy); return; }
    Transition.play(kind, {
      onCover: () => open(name, window.innerWidth / 2, window.innerHeight / 2, { instant: true, gate: true }),
      onReveal: () => { reveal(name); FX.burst(window.innerWidth / 2, window.innerHeight * .4, { count: 50, speed: 9 }); }
    });
  }
  function close(opts = {}) {
    if (!current || Transition.busy) return;
    const v = current; current = null;
    document.body.classList.remove('has-view');
    v.dispatchEvent(new Event('view:close'));
    if (opts.instant) {
      v.classList.add('is-instant'); v.classList.remove('is-open');
      v.hidden = true; v.style.transform = ''; v.style.transition = '';
      requestAnimationFrame(() => v.classList.remove('is-instant'));
    } else {
      v.classList.remove('is-open');
      setTimeout(() => { if (!v.classList.contains('is-open')) v.hidden = true; }, 820);
    }
    if (opener && opener.focus) opener.focus({ preventScroll: true });
  }

  $$('.view').forEach(view => {
    const b = $('[data-close]', view);
    if (b) b.addEventListener('click', () => close());
    /* Vuốt từ mép trái để quay lại như iOS */
    let edge = null;
    view.addEventListener('touchstart', e => { const t = e.touches[0]; edge = t.clientX <= 24 ? { x: t.clientX, y: t.clientY, dx: 0, on: false } : null; }, { passive: true });
    view.addEventListener('touchmove', e => {
      if (!edge) return;
      const t = e.touches[0], dx = t.clientX - edge.x, dy = t.clientY - edge.y;
      if (!edge.on) {
        if (dx > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) edge.on = true;
        else if (Math.abs(dy) > 14) { edge = null; return; } else return;
      }
      edge.dx = dx; view.style.transition = 'none'; view.style.transform = 'translateX(' + dx + 'px)';
    }, { passive: true });
    view.addEventListener('touchend', () => {
      if (!edge || !edge.on) { edge = null; return; }
      const dx = edge.dx; edge = null;
      view.style.transition = 'transform .32s var(--ease-out)';
      if (dx > 110) { view.style.transform = 'translateX(105%)'; setTimeout(() => close({ instant: true }), 320); }
      else { view.style.transform = ''; setTimeout(() => { view.style.transition = ''; }, 360); }
    });
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !Lightbox.isOpen()) close(); });
  return { open, openCinematic, close };
})();

/* =====================================================================
   LIGHTBOX (FLIP + vuốt + zoom chụm + chạm đúp)
   ===================================================================== */
const Lightbox = (() => {
  const root = $('#lightbox'), stage = $('#lbStage'), frame = $('#lbFrame'), img = $('#lbImg');

  }
  function fill(i) {

    count.textContent = (i + 1) + ' / ' + N;
    [i + 1, i - 1].forEach(k => { const im = new Image(); im.src = PHOTOS[(k + N) % N].src; });
  }

    const f = frame.getBoundingClientRect();
    const dx = (rect.left + rect.width / 2) - (f.left + f.width / 2), dy = (rect.top + rect.height / 2) - (f.top + f.height / 2);
    return 'translate(' + dx + 'px,' + dy + 'px) scale(' + (rect.width / f.width) + ')';

    tx = clamp(tx, -mx, mx); ty = clamp(ty, -my, my);
  }

    const from = img.style.transform || 'none';
    z = toZ; tx = toX; ty = toY; applyZoom();

  }

      { transform: rect ? flipTo(rect) : 'scale(.6)', opacity: rect ? 1 : 0, borderRadius: '14px' },

    ], { duration: 720, easing: SPRING });

      const inn = frame.animate([
        { transform: 'translateX(' + (dir * window.innerWidth * .6) + 'px) rotate(' + (dir * 6) + 'deg)', opacity: 0 },
        { transform: 'none', opacity: 1 }
      ], { duration: 520, easing: SPRING });
      inn.onfinish = () => { busy = false; };
    };
  }
  function close() {
    if (!opened || busy) return;
    busy = true; resetZoom(false);
    Album.onIndex(idx);
    const src = Album.sourceEl(idx);
    if (src && Album.mode() === 'grid') src.scrollIntoView({ block: 'nearest' });
    const cur = frame.style.transform || 'none';
    frame.style.transform = '';
    const rect = src ? src.getBoundingClientRect() : null, to = rect ? flipTo(rect) : 'scale(.7)';
    root.classList.remove('is-open'); back.style.opacity = '';
    const a = frame.animate([
      { transform: cur, opacity: 1, borderRadius: '22px' },
      { transform: to, opacity: rect ? 1 : 0, borderRadius: '14px' }
    ], { duration: 480, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' });

    event.clientX -

    mouseDrag.startPos -
    deltaX / unit,

    performance.now();

    now -
    mouseDrag.lastTime;

      0.8 *

    mouseDrag;

      currentDrag.target.closest

            '.cf__item'

      Number(item.dataset.index);

      Lightbox.open(index);

      const dx = cx - ix, dy = cy - iy, dist = Math.hypot(dx, dy) || 1, nd = dist / maxD;
      const el = document.createElement('div'); el.className = 'shard';
      /* Mỗi mảnh chỉ rộng bằng khung bao của tam giác (thay vì cả màn hình) để tiết kiệm bộ nhớ */
      const bx = Math.floor(Math.min(t[0][0], t[1][0], t[2][0])), by = Math.floor(Math.min(t[0][1], t[1][1], t[2][1]));
      const bw = Math.ceil(Math.max(t[0][0], t[1][0], t[2][0])) - bx + 1, bh = Math.ceil(Math.max(t[0][1], t[1][1], t[2][1])) - by + 1;
      el.style.left = bx + 'px'; el.style.top = by + 'px'; el.style.width = bw + 'px'; el.style.height = bh + 'px';
      el.style.backgroundSize = W + 'px ' + H + 'px'; el.style.backgroundPosition = (-bx) + 'px ' + (-by) + 'px';
      const poly = 'polygon(' + t.map(p => (p[0] - bx).toFixed(1) + 'px ' + (p[1] - by).toFixed(1) + 'px').join(',') + ')';
      el.style.clipPath = poly; el.style.webkitClipPath = poly;
      const power = 160 + nd * 420 + Math.random() * 220, ax = Math.random() - .5, ay = Math.random() - .5, az = Math.random() - .5, al = Math.hypot(ax, ay, az) || 1;
      el.style.setProperty('--ox', (cx - bx) + 'px'); el.style.setProperty('--oy', (cy - by) + 'px');
      el.style.setProperty('--tx', (dx / dist * power) + 'px');
      el.style.setProperty('--ty', (dy / dist * power + 240 + Math.random() * 360) + 'px');
      el.style.setProperty('--tz', (120 + Math.random() * 520) + 'px');
      el.style.setProperty('--rx', (ax / al).toFixed(3)); el.style.setProperty('--ry', (ay / al).toFixed(3)); el.style.setProperty('--rz', (az / al).toFixed(3));
      el.style.setProperty('--ra', ((Math.random() > .5 ? 1 : -1) * (120 + Math.random() * 420)) + 'deg');
      el.style.setProperty('--sa', Math.floor(Math.random() * 360) + 'deg');
      el.style.setProperty('--dl', (360 + nd * 280) + 'ms');
      frag.appendChild(el);
    });
    shardsEl.appendChild(frag);

    cracksEl.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const seen = new Set(); let svg = '';
    tris.forEach(t => {
      for (let i = 0; i < 3; i++) {
        const p = t[i], q = t[(i + 1) % 3];
        const key = [p, q].map(v => v[0].toFixed(0) + ',' + v[1].toFixed(0)).sort().join('|');
        if (seen.has(key)) continue; seen.add(key);
        const delay = Math.round(Math.hypot((p[0] + q[0]) / 2 - ix, (p[1] + q[1]) / 2 - iy) / maxD * 260);
        svg += '<path class="crack" pathLength="1" style="--cd:' + delay + 'ms" d="M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + 'L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1) + '"/>';
      }
    });
    cracksEl.innerHTML = svg;
  }

  async function unlock() {
    let ix = window.innerWidth / 2, iy = window.innerHeight * .62;
    if (lastKey) { const r = lastKey.getBoundingClientRect(); ix = r.left + r.width / 2; iy = r.top + r.height / 2; }
    root.style.setProperty('--ix', ix + 'px'); root.style.setProperty('--iy', iy + 'px');
    document.body.classList.add('is-unlocking');
    root.classList.add('is-success'); vibrate([20, 30, 70]);
    await sleep(240);

    if (reduceMotion) {
      root.style.transition = 'opacity .4s'; root.style.opacity = '0';
      Dashboard.reveal(); await sleep(450); root.hidden = true; return;
    }
    buildShards(ix, iy);
    root.classList.add('is-breaking');
    const flash = document.createElement('div');
    flash.className = 'flash'; flash.style.setProperty('--x', ix + 'px'); flash.style.setProperty('--y', iy + 'px');
    document.body.appendChild(flash); flash.addEventListener('animationend', () => flash.remove());
    shockwave(ix, iy); setTimeout(() => shockwave(ix, iy), 160);
    FX.burst(ix, iy, { count: 110, speed: 13, hearts: .45 });

    await sleep(380);
    Dashboard.reveal();
    FX.burst(window.innerWidth / 2, window.innerHeight * .3, { count: 60, speed: 10, hearts: .5 });
    await sleep(1600);
    root.hidden = true; shardsEl.innerHTML = ''; cracksEl.innerHTML = '';
  }
  return { press };
})();

/* =====================================================================
   MÀN MỞ ĐẦU: phát video giới thiệu rồi mở cửa để lộ màn mật khẩu
   ===================================================================== */
const Intro = (() => {
  const root = $('#intro');
  if (!root) { document.body.classList.remove('is-intro'); return null; }
  const video = $('#introVideo'), skipBtn = $('#introSkip');
  let done = false, started = false, watchdog = 0;

  /* Video mở đầu luôn TẮT TIẾNG (file mp4 cũng đã được gỡ hẳn track âm thanh) */
  video.muted = true; video.defaultMuted = true; video.volume = 0;

  async function openDoor() {
    if (done) return;
    done = true;
    clearTimeout(watchdog);
    root.classList.add('is-leaving');
    vibrate(12);
    try { video.pause(); } catch (_) {}

    /* 1) Cửa khép lại che video, lúc này mới hiện màn khóa phía sau */
    root.classList.add('is-closing');
    document.body.classList.remove('is-intro');
    await sleep(580);
    video.style.visibility = 'hidden';
    await sleep(180);

    /* 2) Cửa mở ra, lộ màn mật khẩu phía sau */
    root.classList.remove('is-closing');
    root.classList.add('is-opening');
    vibrate([16, 30, 60]);
    if (typeof FX !== 'undefined') {
      FX.burst(window.innerWidth / 2, window.innerHeight / 2, { count: 46, speed: 9, hearts: .6 });
    }
    await sleep(1000);

    root.classList.add('is-done');
    root.hidden = true;
    video.removeAttribute('src'); video.load();
  }

  skipBtn.addEventListener('click', openDoor);
  video.addEventListener('ended', openDoor);
  video.addEventListener('error', () => { toast('Không tải được video mở đầu'); openDoor(); });
  video.addEventListener('playing', () => { started = true; clearTimeout(watchdog); });

  /* iPhone ở chế độ Tiết kiệm pin (hoặc trình duyệt chặn autoplay) sẽ không cho video tự chạy.
     Khi đó bỏ qua phần mở đầu để không bị kẹt ở màn đen. */
  const p = video.play();
  if (p && p.catch) p.catch(() => { setTimeout(() => { if (!started) openDoor(); }, 400); });
  watchdog = setTimeout(() => { if (!started) openDoor(); }, 4500);
  /* Chốt an toàn: dù video treo giữa chừng cũng không kẹt quá lâu */
  setTimeout(() => openDoor(), 16000);

  return { openDoor };
})();

/* =====================================================================
   CẢM ỨNG TOÀN CỤC: vệt sáng theo ngón tay + chạm nền để thả tim
   ===================================================================== */
(function globalTouch() {
  let start = null;
  const INTERACTIVE = 'button,.tile,.cf__item,.vitem,video,.lightbox,.key,.seg,.mini,.tx,.paper,.hero,.player';
  document.addEventListener('touchstart', e => { const t = e.touches[0]; start = { x: t.clientX, y: t.clientY, target: e.target }; }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (Transition.busy || Lightbox.isOpen()) return;
    const t = e.touches[0]; FX.trail(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!start || Transition.busy || Lightbox.isOpen()) { start = null; return; }
    const t = e.changedTouches[0], s = start; start = null;
    if (Math.hypot(t.clientX - s.x, t.clientY - s.y) > 10) return;
    if (s.target && s.target.closest && s.target.closest(INTERACTIVE)) return;
    if (document.body.classList.contains('is-locked')) return;
    FX.burst(t.clientX, t.clientY, { count: 14, speed: 5, hearts: .7 });
    vibrate(6);
  }, { passive: true });
})();
</script>
